spring.application.name=backend

# ─── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.fjwtrplndkhdmfqtlhbp.supabase.co:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Rahul@637658}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
# Use 'validate' in production, 'update' for first-time local setup
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8081}

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ─── JWT ────────────────────────────────────────────────────────────────────────
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins, e.g.:  http://localhost:5173,https://yourdomain.com
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
